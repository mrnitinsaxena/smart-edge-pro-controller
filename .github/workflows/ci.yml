name: Check configuration

# Validates every model on each push, so mistakes show up in a minute -
# long before a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - pro-controller
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ESPHome (same version as releases)
        run: pip install esphome==2026.11.1

      - name: Validate configuration
        run: esphome config pro_controller/${{ matrix.model }}.yaml > /dev/null
